# Netlify: site estático, sem build. Publica a raiz do repositório.
[build]
  publish = "."

# Cache longo para imagens e logos; HTML/CSS/JS sempre revalidados
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
